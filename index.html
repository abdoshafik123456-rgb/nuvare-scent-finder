<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUVARE | Scent Finder</title>
    <style>
        body { background-color: #0d0d0d; color: #f5f5f5; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; border: 1px solid #d4af37; padding: 30px; border-radius: 12px; max-width: 400px; text-align: center; }
        h1 { color: #d4af37; letter-spacing: 3px; }
        select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: 1px solid #d4af37; background: #0d0d0d; color: #fff; font-size: 16px; }
        button { background: #d4af37; color: #0d0d0d; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; font-size: 18px; color: #d4af37; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NUVARE</h1>
        <p>Find Your Signature Scent</p>
        <select id="vibe">
            <option value="fresh">Fresh & Fruity (Daily Wear)</option>
            <option value="warm">Warm, Vanilla & Sweet</option>
            <option value="woody">Deep, Oud & Woody (Evening)</option>
        </select>
        <button onclick="findScent()">Discover Match</button>
        <div id="result"></div>
    </div>

    <script>
        function findScent() {
            const vibe = document.getElementById('vibe').value;
            const recommendations = {
                fresh: "Recommended: NUVARE Luvira (Bergamot, Pear & Fresh Notes)",
                warm: "Recommended: NUVARE Vilvoura (Vanilla, Peach & Coconut)",
                woody: "Recommended: NUVARE Vidnight & Rivora (Oud, Cedarwood & Patchouli)"
            };
            document.getElementById('result').innerText = recommendations[vibe];
        }
    </script>
</body>
</html>
